version: '3.9'

services:
  # Dịch vụ Database MongoDB
  mongo:
    image: mongo:6.0
    container_name: kanban-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kanban-network

  # Giao diện quản lý MongoDB (tùy chọn)
  mongo-express:
    image: mongo-express
    container_name: kanban-mongo-gui
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
    depends_on:
      - mongo
    networks:
      - kanban-network

  # Backend Node.js
  backend:
    build:
      context: ./backend
    container_name: kanban-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/kanban_pentest
      - JWT_SECRET=super_secret_kanban_lab_2024
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    networks:
      - kanban-network

  # Frontend Vite
  frontend:
    build:
      context: ./frontend
    container_name: kanban-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - kanban-network

volumes:
  mongo-data:

networks:
  kanban-network:
    driver: bridge
